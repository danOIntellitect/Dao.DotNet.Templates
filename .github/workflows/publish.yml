name: Validate and publish templates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Trust HTTPS development certificate
        run: |
          dotnet dev-certs https --trust
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/usr/lib/ssl/certs${SSL_CERT_DIR:+:$SSL_CERT_DIR}" >> "$GITHUB_ENV"

      - name: Generate and test all templates
        run: pwsh -NoProfile -File tests/Test-Templates.ps1 -Stage Test

  desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Generate Avalonia template
        run: pwsh -NoProfile -File tests/Test-Templates.ps1 -Stage Generate -Templates Avalonia -ArtifactsDirectory artifacts/desktop-validation

      - name: Run Avalonia headless tests
        run: dotnet test tests/Template.DesktopTests/Template.DesktopTests.csproj --configuration Release "-p:GeneratedRoot=${{ github.workspace }}\artifacts\desktop-validation\generated" -p:EnableWindowsTargeting=true --logger trx --results-directory artifacts/desktop-validation/TestResults

  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' }}
    needs: [validate, desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build --configuration Release --no-restore

      - name: Pack NuGet package
        run: dotnet pack --configuration Release --no-build -o ./artifacts

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
